services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./apps/api/app:/app/app
      - ./seed:/app/seed:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./apps/web/app:/app/app
      - ./apps/web/components:/app/components
      - ./apps/web/lib:/app/lib
    depends_on:
      - api
