[project]
name = "minorte-api"
version = "0.1.0"
description = "MiNorte by Banorte - API (T0 esqueleto + contratos)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "supabase>=2.0",
  "rapidfuzz>=3.0",
  "openai>=1.0",
  "mcp>=1.0",
  "openpyxl>=3.1",
  "playwright>=1.45",
  "opencv-python-headless>=4.9",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "qrcode[pil]>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
